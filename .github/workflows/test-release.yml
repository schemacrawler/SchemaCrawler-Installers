name: Test Packaged Releases

on:
  workflow_dispatch:

jobs:
  test-brew:
    name: Test Homebrew package
    runs-on: macos-latest
    outputs:
      version-output: ${{ steps.brew-smoke-test.outputs.version-output }}

    steps:
      - id: brew-setup
        name: Set up Homebrew
        shell: bash
        run: |
          # Install Homebrew
          brew update
          brew -v
          # Set up SchemaCrawler tap
          brew tap schemacrawler/homebrew-tap
          brew trust --formula schemacrawler/tap/schemacrawler
          echo '$ brew info schemacrawler'
          brew info --formula schemacrawler

      - id: brew-install
        name: Install SchemaCrawler with Homebrew
        shell: bash
        run: |
          # Install SchemaCrawler
          brew install --formula schemacrawler

      - id: brew-smoke-test
        name: Smoke test command
        shell: bash
        run: |
          # Check that SchemaCrawler is installed
          schemacrawler --version
          # Produce report
          version_output=$(schemacrawler --version)
          printf '%s\n' "$version_output"
          printf 'version-output<<VERSION_OUTPUT\n%s\nVERSION_OUTPUT\n' "$version_output" >> "$GITHUB_OUTPUT"

  test-sdkman:
    name: Test SDKMAN candidate
    runs-on: ubuntu-slim
    outputs:
      version-output: ${{ steps.sdkman-smoke-test.outputs.version-output }}

    env:
      SDKMAN_DIR: ${{ github.workspace }}/.sdkman

    steps:
      - id: sdkman-java-setup
        name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - id: sdkman-setup
        name: Set up SDKMAN
        shell: bash
        run: |
          # Install SDKMAN
          echo "$SDKMAN_DIR"
          curl -s "https://get.sdkman.io?ci=true" | bash
          source "$SDKMAN_DIR/bin/sdkman-init.sh"
          sdk version
          # Check for current version of SchemaCrawler
          echo '$ sdk list schemacrawler'
          sdk list schemacrawler | cat

      - id: sdkman-install
        name: Install SchemaCrawler with SDKMAN
        shell: bash
        run: |
          # Install SchemaCrawler
          source "$SDKMAN_DIR/bin/sdkman-init.sh"
          sdk install schemacrawler

      - id: sdkman-smoke-test
        name: Smoke test command
        shell: bash
        run: |
          # Check that SchemaCrawler is installed
          source "$SDKMAN_DIR/bin/sdkman-init.sh"
          schemacrawler.sh --version
          # Produce report
          version_output=$(schemacrawler.sh --version)
          printf '%s\n' "$version_output"
          printf 'version-output<<VERSION_OUTPUT\n%s\nVERSION_OUTPUT\n' "$version_output" >> "$GITHUB_OUTPUT"

  test-scoop:
    name: Test Scoop package
    runs-on: windows-latest
    outputs:
      version-output: ${{ steps.scoop-smoke-test.outputs.version-output }}

    steps:
      - id: scoop-setup
        name: Set up Scoop
        shell: pwsh
        run: |
          # Install Scoop
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop --version
          scoop update
          # Check for current version of SchemaCrawler
          Write-Output '> scoop info schemacrawler'
          scoop info schemacrawler

      - id: scoop-install
        name: Install SchemaCrawler with Scoop
        shell: pwsh
        run: |
          # Install SchemaCrawler
          $env:PATH += ";$env:USERPROFILE\scoop\shims"
          scoop install --skip-hash-check schemacrawler

      - id: scoop-smoke-test
        name: Smoke test command
        shell: pwsh
        run: |
          # Check that SchemaCrawler is installed
          $env:PATH += ";$env:USERPROFILE\scoop\shims"
          schemacrawler --version
          # Produce report
          $versionOutput = schemacrawler --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versionOutput
          "version-output<<VERSION_OUTPUT`n$($versionOutput -join "`n")`nVERSION_OUTPUT" >> $env:GITHUB_OUTPUT

  test-winget:
    name: Test Winget package
    runs-on: windows-latest
    outputs:
      version-output: ${{ steps.winget-smoke-test.outputs.version-output }}

    steps:
      - id: winget-setup
        name: Set up Winget
        shell: pwsh
        run: |
          # Check Winget version
          winget --version
          # Check for current version of SchemaCrawler
          Write-Output '> winget show SchemaCrawler.SchemaCrawler'
          winget show SchemaCrawler.SchemaCrawler --accept-source-agreements

      - id: winget-install
        name: Install SchemaCrawler with Winget
        shell: pwsh
        run: |
          # Install SchemaCrawler
          winget install SchemaCrawler.SchemaCrawler --accept-package-agreements --accept-source-agreements

      - id: winget-smoke-test
        name: Smoke test command
        shell: pwsh
        run: |
          # Check that SchemaCrawler is installed
          & 'C:\Program Files\SchemaCrawler\SchemaCrawler.exe' --version
          # Produce report
          $versionOutput = & 'C:\Program Files\SchemaCrawler\SchemaCrawler.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versionOutput
          "version-output<<VERSION_OUTPUT`n$($versionOutput -join "`n")`nVERSION_OUTPUT" >> $env:GITHUB_OUTPUT

  test-chocolatey:
    name: Test Chocolatey package
    runs-on: windows-latest
    outputs:
      version-output: ${{ steps.chocolatey-smoke-test.outputs.version-output }}

    steps:
      - id: chocolatey-setup
        name: Set up Chocolatey
        shell: pwsh
        run: |
          # Check Chocolatey version
          choco --version
          # Check for current version of SchemaCrawler
          Write-Output '$ choco info schemacrawler'
          choco info schemacrawler

      - id: chocolatey-install
        name: Install SchemaCrawler with Chocolatey
        shell: pwsh
        run: |
          # Install SchemaCrawler
          choco install schemacrawler -y

      - id: chocolatey-smoke-test
        name: Smoke test command
        shell: pwsh
        run: |
          # Check that SchemaCrawler is installed
          schemacrawler --version
          # Produce report
          $versionOutput = schemacrawler --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versionOutput
          "version-output<<VERSION_OUTPUT`n$($versionOutput -join "`n")`nVERSION_OUTPUT" >> $env:GITHUB_OUTPUT

  test-docker:
    name: Test Docker image
    runs-on: ubuntu-latest
    outputs:
      version-output: ${{ steps.docker-smoke-test.outputs.version-output }}

    steps:
      - id: docker-pull
        name: Install SchemaCrawler with Docker
        shell: bash
        run: |
          # Pull SchemaCrawler image
          docker pull schemacrawler/schemacrawler:latest

      - id: docker-smoke-test
        name: Smoke test command
        shell: bash
        run: |
          # Check that SchemaCrawler is runs
          # (Add an additional -it argument if you want to run interactively)
          docker run --rm \
            --name schemacrawler \
            --volume "$(pwd):/home/schcrwlr/share" \
            schemacrawler/schemacrawler:latest \
            /opt/schemacrawler/bin/schemacrawler.sh --version
          # Produce report
          version_output=$(docker run --rm \
            --name schemacrawler \
            --volume "$(pwd):/home/schcrwlr/share" \
            schemacrawler/schemacrawler:latest \
            /opt/schemacrawler/bin/schemacrawler.sh --version)
          printf '%s\n' "$version_output"
          printf 'version-output<<VERSION_OUTPUT\n%s\nVERSION_OUTPUT\n' "$version_output" >> "$GITHUB_OUTPUT"

  release-summary:
    name: Published version report
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-brew
      - test-sdkman
      - test-scoop
      - test-winget
      - test-chocolatey
      - test-docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Report package and Maven Central versions
        env:
          PACKAGE_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/release-summary.py
